<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Final Fantasy IX Roguelike</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Nunito:wght@500;700;800&family=Alegreya+Sans:wght@400;500;700&family=Cinzel:wght@600;700&family=DotGothic16&family=Silkscreen:wght@400;700&family=Jersey+10&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved font picks before first paint (their CSS variables, cached by src/features/settings/fonts.ts).
      try {
        const vars = JSON.parse(localStorage.getItem("ff-font-vars") || "{}");
        for (const k in vars) document.documentElement.style.setProperty(k, vars[k]);
      } catch {
        // index.css's defaults apply
      }
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
